
<section id="solicitar-pago" style="max-width:650px;margin:48px auto;padding:28px;border:1px solid #e5e7eb;border-radius:16px;font-family:Arial,sans-serif;color:#1f2937;">
  <h2 style="margin-top:0;">Adquiere SoftCancun</h2>

  <p>Completa tus datos para iniciar tu solicitud de compra.</p>

  <div style="background:#f0fdfa;padding:18px;border-radius:12px;margin:20px 0;">
    <p style="margin:0;">Precio: $1,200.00 MXN</p>
    <p style="margin:4px 0;">IVA (16%): $192.00 MXN</p>
    <h3 style="margin:8px 0 0;">Total: $1,392.00 MXN</h3>
  </div>

  <form id="formulario-pago">
    <div style="margin-bottom:16px;">
      <label for="pago-nombre" style="display:block;margin-bottom:6px;">
        Nombre completo
      </label>
      <input
        id="pago-nombre"
        name="nombre"
        type="text"
        required
        minlength="2"
        maxlength="120"
        autocomplete="name"
        style="box-sizing:border-box;width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px;"
      >
    </div>

    <div style="margin-bottom:16px;">
      <label for="pago-correo" style="display:block;margin-bottom:6px;">
        Correo electrónico
      </label>
      <input
        id="pago-correo"
        name="correo"
        type="email"
        required
        maxlength="254"
        autocomplete="email"
        style="box-sizing:border-box;width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px;"
      >
    </div>

    <button
      id="boton-pago"
      type="submit"
      style="width:100%;padding:14px;background:#0f766e;color:white;border:0;border-radius:8px;font-weight:bold;cursor:pointer;"
    >
      Continuar con la solicitud
    </button>

    <p
      id="pago-mensaje"
      role="status"
      aria-live="polite"
      style="margin-top:16px;overflow-wrap:anywhere;"
    >
      Introduce tus datos para comenzar.
    </p>
  </form>
</section>

<script>
(() => {
  "use strict";

  const formularioPago = document.getElementById("formulario-pago");
  const mensajePago = document.getElementById("pago-mensaje");
  const botonPago = document.getElementById("boton-pago");

  const URL_FUNCION =
    "https://ditgnslgumgzmgleaffm.supabase.co/functions/v1/crear-pago";

  // Usa aquí tu clave PUBLICABLE de Supabase.
  // Nunca pongas una clave sb_secret_ o service_role en esta página.
  const CLAVE_PUBLICA = "PEGA_AQUI_TU_CLAVE_PUBLICA";

  if (!formularioPago || !mensajePago || !botonPago) {
    console.error("No se encontraron los elementos del formulario de pago.");
    return;
  }

  formularioPago.addEventListener("submit", async (evento) => {
    evento.preventDefault();

    if (CLAVE_PUBLICA === "sb_publishable__5DTPPAJpyYjwEA30m3h1A_GAQNM3qD") {
      mensajePago.textContent =
        "Falta configurar la clave pública de Supabase en la página.";
      return;
    }

    const nombre =
      document.getElementById("pago-nombre").value.trim();

    const correo =
      document.getElementById("pago-correo").value.trim();

    if (nombre.length < 2 || !correo) {
      mensajePago.textContent =
        "Escribe tu nombre completo y un correo válido.";
      return;
    }

    botonPago.disabled = true;
    botonPago.textContent = "Registrando solicitud...";
    mensajePago.textContent = "Conectando con el servicio de pagos...";

    try {
      const respuesta = await fetch(URL_FUNCION, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": CLAVE_PUBLICA
        },
        body: JSON.stringify({ nombre, correo })
      });

      const resultado = await respuesta.json().catch(() => ({}));

      if (!respuesta.ok) {
        throw new Error(
          resultado.error ||
          "No se pudo registrar la solicitud. Código: " + respuesta.status
        );
      }

      if (!resultado.id) {
        throw new Error(
          "El servidor respondió, pero no devolvió un folio de solicitud."
        );
      }

      mensajePago.textContent =
        "Solicitud registrada correctamente. " +
        "Total: $1,392 MXN. Estado: pendiente de revisión. " +
        "Folio: " + resultado.id +
        ". Guarda este folio para consultar tu solicitud.";

      formularioPago.reset();
    } catch (error) {
      console.error("Error al registrar la solicitud:", error);
      mensajePago.textContent =
        error.message ||
        "No se pudo conectar con el servidor. Inténtalo nuevamente.";
    } finally {
      botonPago.disabled = false;
      botonPago.textContent = "Continuar con la solicitud";
    }
  });
})();
</script>
